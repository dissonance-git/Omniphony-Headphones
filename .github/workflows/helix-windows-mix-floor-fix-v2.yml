name: Helix Windows mix-floor repair

on:
  push:
    paths:
      - .helix/apply_windows_mix_floor_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .helix/apply_windows_mix_floor_fix.py
      - run: git diff --check
      - run: |
          git config user.name helix-ci
          git config user.email helix-ci@users.noreply.github.com
          git add omniphony-renderer/windows_installer/endpoint_apo/Install-OmniphonyWindows.ps1
          git add omniphony-renderer/windows_installer/endpoint_apo/OmniphonyMixProbe.cpp
          git rm .helix/apply_windows_mix_floor_fix.py
          git rm .github/workflows/helix-windows-mix-floor-fix-v2.yml
          git commit -m "fix(windows): accept endpoint-native mix geometry"
          git push origin HEAD:main

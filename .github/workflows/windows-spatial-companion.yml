name: Windows spatial companion package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-spatial-companion.yml'
      - 'omniphony-renderer/windows_installer/spatial_companion/**'

permissions:
  contents: read

jobs:
  build-companion:
    name: Build packaged Spatial Sound companion
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout Omniphony
        uses: actions/checkout@v4

      - name: Setup VS2022 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build signed development MSIX and single EXE
        shell: pwsh
        run: |
          $script = "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_companion\Build-SpatialCompanionPackage.ps1"
          & $script -Sign
          if ($LASTEXITCODE -ne 0) { throw "Spatial companion package build failed: $LASTEXITCODE" }

      - name: Validate packaged ownership bridge contract
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist\Omniphony-Spatial-Companion"
          $msix = Join-Path $dist 'OmniphonySpatialCompanion.msix'
          $cer = Join-Path $dist 'OmniphonySpatialCompanion.cer'
          $setup = Join-Path $dist 'OmniphonySpatialSetup.exe'
          $readme = Join-Path $dist 'README.md'
          if (-not (Test-Path $msix)) { throw "Missing MSIX: $msix" }
          if (-not (Test-Path $cer)) { throw "Missing development certificate: $cer" }
          if (-not (Test-Path $setup)) { throw "Missing single-file setup executable: $setup" }
          if (-not (Test-Path $readme)) { throw "Missing physical-test instructions: $readme" }

          $kitsBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $makeAppx = Get-ChildItem -Path $kitsBin -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $makeAppx) { throw 'MakeAppx.exe not found.' }

          $unpacked = "$env:GITHUB_WORKSPACE\build\spatial-companion-unpacked"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $unpacked
          & $makeAppx.FullName unpack /p $msix /d $unpacked /o
          if ($LASTEXITCODE -ne 0) { throw "MSIX unpack failed: $LASTEXITCODE" }

          $manifest = Get-Content -LiteralPath (Join-Path $unpacked 'AppxManifest.xml') -Raw
          if ($manifest -notmatch 'Name="Omniphony\.SpatialCompanion"') { throw 'Package identity drifted.' }
          if ($manifest -notmatch 'Category="windows\.mediaPlayback"') { throw 'windows.mediaPlayback extension missing.' }
          if ($manifest -notmatch '<uap:Codec Name="\{4BD75423-A66C-4586-B782-1FCBBDF2AE74\}"') { throw 'Spatial subtype media-component binding drifted.' }
          if ($manifest -notmatch 'Category="windows\.appService"') { throw 'windows.appService extension missing.' }
          if ($manifest -notmatch 'Name="OmniphonySpatialLicense"') { throw 'Spatial license AppService name drifted.' }
          if ($manifest -notmatch 'OmniphonySpatialLicenseService\.SpatialLicenseService') { throw 'Spatial license service entry point drifted.' }
          if ($manifest -notmatch 'Category="windows\.appExecutionAlias"') { throw 'Packaged companion execution alias missing.' }

          foreach ($name in @(
            'OmniphonySpatialCompanion.exe',
            'OmniphonySpatialLicenseService.dll',
            'OmniphonySpatialLicenseService.winmd'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $unpacked $name))) { throw "Missing packaged payload: $name" }
          }

          $serviceSource = Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_companion\AppServiceComponent\SpatialLicenseService.cpp" -Raw
          foreach ($token in @('GetLicenseInfo','GetRuntimeParameters','Status','ExpirationDate','IsAudioRendererCapable','LaunchUri')) {
            if ($serviceSource -notmatch [regex]::Escape($token)) { throw "License broker response token missing: $token" }
          }

          $companionSource = Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_companion\OmniphonySpatialCompanion.cpp" -Raw
          foreach ($token in @(
            'RegisterMediaExtensionPackage',
            'MEDIA_EXTENSION_REGISTERED',
            'GetDefaultAudioEndpoint',
            'DEFAULT_RENDER_ENDPOINT_DISCOVERED',
            'WINDOWS_SETTER_ACCEPTED_CONTEXT',
            'SPATIAL_OWNERSHIP_VERIFY_DEFAULT_OK'
          )) {
            if ($companionSource -notmatch [regex]::Escape($token)) { throw "Packaged ownership diagnostic token missing: $token" }
          }
          if ($companionSource -match 'CALLER_OWNS_FORMAT_REQUIRED_BY_WINDOWS') { throw 'Companion still contains an unproven ownership assertion.' }

          $setupSource = Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_companion\OmniphonySpatialSetup.cpp" -Raw
          foreach ($token in @(
            'TrustedPeople',
            'Omniphony Development',
            'AddPackageByUriAsync',
            'ForceUpdateFromAnyVersion',
            'ShellExecuteExW',
            'runas',
            'SPATIAL_SETUP_BOOTSTRAP_MEDIUM_OK',
            'SPATIAL_SETUP_ADMIN_PHASE_ELEVATED_OK',
            'SPATIAL_SETUP_CERT_TRUSTED_BY_ADMIN',
            'SPATIAL_SETUP_USER_PHASE_MEDIUM_OK',
            'RegisterMediaExtensionPackage',
            'SPATIAL_SETUP_MEDIA_EXTENSION_REGISTERED',
            'SPATIAL_SETUP_PACKAGED_REGISTER_EXIT_CODE',
            'GetDefaultAudioEndpoint',
            'SPATIAL_SETUP_DEFAULT_RENDER_ENDPOINT_DISCOVERED',
            'OmniphonySpatialCompanion.exe',
            'notify',
            'select',
            'SPATIAL_SETUP_VERIFY_DEFAULT_OK'
          )) {
            if ($setupSource -notmatch [regex]::Escape($token)) { throw "Single-file setup contract token missing: $token" }
          }
          if ($setupSource -match 'CreateProcessWithTokenW') { throw 'Single-file setup still contains the rejected token-spawn de-elevation path.' }

          $cmakeSource = Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_companion\CMakeLists.txt" -Raw
          if ($cmakeSource -notmatch "level='asInvoker'") { throw 'Single-file setup must start at medium integrity with an asInvoker manifest.' }
          if ($cmakeSource -match "level='requireAdministrator'") { throw 'Single-file setup must not force the whole process to high integrity.' }

          # The setup EXE is a normal PE file followed by exact MSIX + CER payloads and a 32-byte footer.
          # Prove the embedded payload bytes are byte-for-byte identical to the separately validated outputs.
          $stream = [IO.File]::OpenRead($setup)
          try {
            if ($stream.Length -lt 32) { throw 'Single-file setup is too small for its bundle footer.' }
            [void]$stream.Seek(-32, [IO.SeekOrigin]::End)
            $reader = New-Object IO.BinaryReader($stream, [Text.Encoding]::UTF8, $true)
            try {
              $magic = [Text.Encoding]::ASCII.GetString($reader.ReadBytes(16))
              $embeddedMsixSize = $reader.ReadUInt64()
              $embeddedCerSize = $reader.ReadUInt64()
              if ($magic -ne 'OMNISPATBUNDLE1!') { throw "Single-file bundle magic drifted: $magic" }
              if ($embeddedMsixSize -eq 0 -or $embeddedCerSize -eq 0) { throw 'Single-file bundle contains an empty payload.' }
              if ($embeddedMsixSize -gt [int]::MaxValue -or $embeddedCerSize -gt [int]::MaxValue) { throw 'Single-file bundle payload exceeds CI verifier limits.' }

              $payloadOffset = [Int64]$stream.Length - 32 - [Int64]$embeddedMsixSize - [Int64]$embeddedCerSize
              if ($payloadOffset -le 0) { throw 'Single-file bundle payload offsets are invalid.' }
              [void]$stream.Seek($payloadOffset, [IO.SeekOrigin]::Begin)
              $embeddedMsix = $reader.ReadBytes([int]$embeddedMsixSize)
              $embeddedCer = $reader.ReadBytes([int]$embeddedCerSize)
              if ($embeddedMsix.Length -ne [int]$embeddedMsixSize) { throw 'Embedded MSIX is truncated.' }
              if ($embeddedCer.Length -ne [int]$embeddedCerSize) { throw 'Embedded certificate is truncated.' }
            } finally {
              $reader.Dispose()
            }
          } finally {
            $stream.Dispose()
          }

          $bundleCheck = "$env:GITHUB_WORKSPACE\build\spatial-setup-bundle-check"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $bundleCheck
          New-Item -ItemType Directory -Force -Path $bundleCheck | Out-Null
          $embeddedMsixPath = Join-Path $bundleCheck 'embedded.msix'
          $embeddedCerPath = Join-Path $bundleCheck 'embedded.cer'
          [IO.File]::WriteAllBytes($embeddedMsixPath, $embeddedMsix)
          [IO.File]::WriteAllBytes($embeddedCerPath, $embeddedCer)
          if ((Get-FileHash -LiteralPath $embeddedMsixPath -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $msix -Algorithm SHA256).Hash) {
            throw 'Embedded MSIX bytes do not match the validated package.'
          }
          if ((Get-FileHash -LiteralPath $embeddedCerPath -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $cer -Algorithm SHA256).Hash) {
            throw 'Embedded certificate bytes do not match the signing public certificate.'
          }

          $readmeSource = Get-Content -LiteralPath $readme -Raw
          if ($readmeSource -notmatch 'OmniphonySpatialSetup\.exe') { throw 'Single-file setup instructions are missing from artifact README.' }
          if ($readmeSource -notmatch 'OmniphonySpatialCompanion\.exe verify-default') { throw 'One-command physical ownership test is missing from artifact README.' }

          Write-Host 'SPATIAL_COMPANION_MSIX_CONTRACT_OK 1'
          Write-Host 'SPATIAL_COMPANION_PACKAGE_IDENTITY_OK 1'
          Write-Host 'SPATIAL_COMPANION_MEDIA_COMPONENT_DECLARED 1'
          Write-Host 'SPATIAL_COMPANION_SPATIAL_SUBTYPE_DECLARED 1'
          Write-Host 'SPATIAL_COMPANION_MEDIA_EXTENSION_REGISTRATION_PATH_OK 1'
          Write-Host 'SPATIAL_COMPANION_MEDIUM_BOOTSTRAP_ELEVATED_CERT_CHILD_PATH_OK 1'
          Write-Host 'SPATIAL_COMPANION_MEDIUM_PACKAGED_REGISTRATION_FALLBACK_OK 1'
          Write-Host 'SPATIAL_COMPANION_DEFAULT_ENDPOINT_DISCOVERY_PATH_OK 1'
          Write-Host 'SPATIAL_COMPANION_ONE_COMMAND_PHYSICAL_GATE_OK 1'
          Write-Host 'SPATIAL_COMPANION_APP_SERVICE_CONTRACT_OK 1'
          Write-Host 'SPATIAL_COMPANION_SINGLE_EXE_BUNDLE_OK 1'
          Write-Host 'SPATIAL_COMPANION_SINGLE_EXE_EMBEDDED_MSIX_MATCH_OK 1'
          Write-Host 'SPATIAL_COMPANION_SINGLE_EXE_EMBEDDED_CERT_MATCH_OK 1'
          Write-Host 'SPATIAL_COMPANION_EXTERNAL_OWNERSHIP_GATE_UNPROVEN 1'

      - name: Upload spatial companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniphony-spatial-companion-${{ github.sha }}
          path: dist/Omniphony-Spatial-Companion
          if-no-files-found: error
          retention-days: 14

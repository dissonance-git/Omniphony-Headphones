name: Current decoded-frame ingress

on:
  push:
    branches: [helix/current-decoded-frame-ingress]
    paths:
      - '.github/workflows/current-decoded-frame-ingress.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: omniphony-renderer
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup component add rustfmt

      - name: Formatting
        run: rustfmt --edition 2024 --check orender_engine/src/engine.rs orender_engine/src/music_support.rs

      - name: Differential null
        run: cargo test -p orender_engine music_support::tests::direct_current_ingress_matches_streaming_reference_bridge -- --exact --nocapture

      - name: Full engine regressions
        run: cargo test -p orender_engine --lib --tests

      - name: Realtime worker regressions
        run: cargo test -p realtime_ffi --lib

      - name: Authored-bed worker regressions
        run: |
          sed -i '/^resolver = "2"$/a exclude = ["bed_ffi"]' Cargo.toml
          cargo test --manifest-path bed_ffi/Cargo.toml --lib

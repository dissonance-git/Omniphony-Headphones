name: GitLab Windows Listening Lab

on:
  push:
    paths:
      - '.github/workflows/gitlab-windows-listening-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GITLAB_REF: e6f61226304c68a5b17658a33be4eef79d4d48d6
    steps:
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Clone exact GitLab source
        shell: pwsh
        run: |
          git clone --filter=blob:none https://gitlab.com/dissonance-git/Omniphony-Headphones.git source
          if ($LASTEXITCODE -ne 0) { throw "GitLab clone failed: $LASTEXITCODE" }
          Push-Location source
          git fetch origin $env:GITLAB_REF --depth=1
          if ($LASTEXITCODE -ne 0) { throw "GitLab target fetch failed: $LASTEXITCODE" }
          git checkout --detach $env:GITLAB_REF
          if ($LASTEXITCODE -ne 0) { throw "GitLab target checkout failed: $LASTEXITCODE" }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITLAB_REF) { throw "GitLab SHA mismatch actual=$actual expected=$env:GITLAB_REF" }
          Pop-Location
          Write-Host "GITLAB_EXACT_SOURCE_OK $actual"

      - name: Build listening lab
        shell: pwsh
        run: |
          Push-Location source\omniphony-renderer
          cargo build --release -p realtime_ffi --bin omniphony-listening-lab
          if ($LASTEXITCODE -ne 0) { throw "Listening lab build failed: $LASTEXITCODE" }
          Pop-Location

          $exe = "$env:GITHUB_WORKSPACE\source\omniphony-renderer\target\release\omniphony-listening-lab.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Listening lab executable missing: $exe"
          }

          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          Copy-Item $exe "$env:GITHUB_WORKSPACE\dist\OmniphonyListeningLab.exe" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "$env:GITHUB_WORKSPACE\dist\OmniphonyListeningLab.exe").Hash.ToLowerInvariant()
          "$hash  OmniphonyListeningLab.exe" | Set-Content "$env:GITHUB_WORKSPACE\dist\OmniphonyListeningLab.sha256" -Encoding ascii
          Write-Host "OMNIPHONY_LISTENING_LAB_BUILD_OK 1"
          Write-Host "OMNIPHONY_LISTENING_LAB_GITLAB_SHA $env:GITLAB_REF"
          Write-Host "OMNIPHONY_LISTENING_LAB_SHA256 $hash"

      - name: Upload listening lab
        uses: actions/upload-artifact@v4
        with:
          name: omniphony-listening-lab-${{ github.sha }}
          path: |
            dist/OmniphonyListeningLab.exe
            dist/OmniphonyListeningLab.sha256
          if-no-files-found: error
          retention-days: 14

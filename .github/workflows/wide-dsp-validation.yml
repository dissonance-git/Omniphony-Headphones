name: Wide DSP validation

on:
  push:
    branches: [main]
    paths:
      - 'layouts/system-h-derived-22.0-upper60-grid10.yaml'
      - 'omniphony-renderer/renderer/**'
      - 'omniphony-renderer/orender_engine/tests/current_scene_geometry.rs'
      - 'omniphony-renderer/dsp_fixtures/**'
      - 'omniphony-renderer/Cargo.toml'
      - '.github/workflows/wide-dsp-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'layouts/system-h-derived-22.0-upper60-grid10.yaml'
      - 'omniphony-renderer/renderer/**'
      - 'omniphony-renderer/orender_engine/tests/current_scene_geometry.rs'
      - 'omniphony-renderer/dsp_fixtures/**'
      - 'omniphony-renderer/Cargo.toml'
      - '.github/workflows/wide-dsp-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Bind cancellation to duplicate validation of one commit, not to the shared
  # main ref used by concurrent agents.
  group: omniphony-wide-dsp-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  wide-dsp:
    name: Wide DSP matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"

      - name: Current 8.1.4.4 scene through 22-direction shell
        run: cargo test -p orender_engine --test current_scene_geometry -- --nocapture

      - name: Multi-rate LR4 reconstruction
        run: >-
          cargo test -p renderer --features wide-matrix
          crossover::validation::lr4_reconstruction_is_magnitude_flat_wide
          -- --exact --nocapture

      - name: Full-azimuth ITD model agreement
        run: >-
          cargo test -p renderer --features wide-matrix
          binaural::validation::itd_magnitude_tracks_the_model_wide
          -- --exact --nocapture

      - name: Full-sphere VBAP energy with MDAP spread
        run: >-
          cargo test -p renderer --release --features wide-matrix
          spatial_vbap::panner::native_validation::vbap_conserves_energy_over_the_sphere_wide
          -- --exact --nocapture

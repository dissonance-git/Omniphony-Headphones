name: Omniphony renderer

on:
  push:
    branches: [main]
    paths:
      - "omniphony-renderer/.cargo/**"
      - "omniphony-renderer/audio_contract/**"
      - "omniphony-renderer/scene_contract/**"
      - "omniphony-renderer/renderer/**"
      - "omniphony-renderer/orender_engine/**"
      - "omniphony-renderer/realtime_ffi/**"
      - "omniphony-renderer/source_ffi/**"
      - "omniphony-renderer/dsp_fixtures/**"
      - "omniphony-renderer/bridge_api/**"
      - "omniphony-renderer/reference_bridge/**"
      - "omniphony-renderer/runtime_control/**"
      - "omniphony-renderer/sys/**"
      - "omniphony-renderer/windows_host/**"
      - "omniphony-renderer/assets/**"
      - "omniphony-renderer/Cargo.toml"
      - "omniphony-renderer/Cargo.lock"
      - "layouts/**"
      - ".github/workflows/windows-renderer.yml"
  pull_request:
    branches: [main]
    paths:
      - "omniphony-renderer/.cargo/**"
      - "omniphony-renderer/audio_contract/**"
      - "omniphony-renderer/scene_contract/**"
      - "omniphony-renderer/renderer/**"
      - "omniphony-renderer/orender_engine/**"
      - "omniphony-renderer/realtime_ffi/**"
      - "omniphony-renderer/source_ffi/**"
      - "omniphony-renderer/dsp_fixtures/**"
      - "omniphony-renderer/bridge_api/**"
      - "omniphony-renderer/reference_bridge/**"
      - "omniphony-renderer/runtime_control/**"
      - "omniphony-renderer/sys/**"
      - "omniphony-renderer/windows_host/**"
      - "omniphony-renderer/assets/**"
      - "omniphony-renderer/Cargo.toml"
      - "omniphony-renderer/Cargo.lock"
      - "layouts/**"
      - ".github/workflows/windows-renderer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Distinct main commits may belong to different concurrent agents. Do not
  # cancel one exact-SHA validation merely because another commit landed.
  group: omniphony-renderer-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  portable-core:
    name: Portable renderer core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Report formatting drift
        shell: bash
        run: |
          if ! git diff --quiet -- '*.rs'; then
            echo "::warning::rustfmt changed committed Rust source; compiler/tests will run on the normalized worktree"
            git diff --stat -- '*.rs'
          fi

      - name: Test portable PCM stream contract
        run: cargo test -p audio_contract

      - name: Test authored scene contract
        run: cargo test -p scene_contract

      - name: Test native-host realtime PCM ABI
        run: cargo test -p realtime_ffi

      - name: Test causal source render ABI
        run: cargo test -p source_ffi

      - name: Test DSP measurement harness
        run: cargo test -p dsp_fixtures

      - name: Test renderer core
        run: >-
          cargo test -p renderer --
          --skip binaural::tests::hrir_source_switch_lands_asynchronously_without_blocking_render

  windows-core:
    name: Windows native app compile
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Diagnose Windows runner
        run: |
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Get-Command rustup -ErrorAction Stop | Format-List Source
          Get-Command cargo -ErrorAction Stop | Format-List Source
          Get-Command rustc -ErrorAction Stop | Format-List Source

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Report formatting drift
        run: |
          git diff --quiet -- '*.rs'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'rustfmt changed committed Rust source; compiler/checks will run on the normalized worktree'
            git diff --stat -- '*.rs'
            $global:LASTEXITCODE = 0
          }

      - name: Check native Windows host
        run: cargo check -p windows_host --bin omniphony_app

      - name: Check causal source render DLL
        run: cargo check -p source_ffi

      - name: Test canonical HRTF early-reflection field
        run: cargo test -p orender_engine music_early_reflections::tests

      - name: Test realtime continuity guards
        run: cargo test -p windows_host --bin omniphony_app music_engine::tests

  windows-live-artifact:
    name: Windows x64 Omniphony reference host
    runs-on: windows-latest
    needs: [portable-core, windows-core]
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Test embedded bridge and headless engine boundaries
        run: cargo test -p reference_bridge -p orender_engine

      - name: Build Omniphony
        run: cargo build --profile release-deploy -p windows_host --bin omniphony_app

      - name: Build causal source renderer DLL
        run: cargo build --profile release-deploy -p source_ffi

      - name: Collect minimal reference runtime
        run: |
          $dist = Join-Path $PWD 'dist\windows-x64'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item 'target\release-deploy\omniphony_app.exe' (Join-Path $dist 'Omniphony.exe') -Force
          Copy-Item 'windows_host\START-OMNIPHONY.cmd' (Join-Path $dist 'START-OMNIPHONY.cmd') -Force

          $files = @(Get-ChildItem $dist -File)
          if ($files.Count -ne 2) {
            throw "minimal Omniphony package must contain exactly two files; found $($files.Count)"
          }
          foreach ($required in @('START-OMNIPHONY.cmd', 'Omniphony.exe')) {
            if (!(Test-Path (Join-Path $dist $required))) {
              throw "required minimal runtime file missing: $required"
            }
          }
          Get-ChildItem $dist | Format-Table Name, Length

      - name: Collect causal source SDK
        run: |
          $dist = Join-Path $PWD 'dist\source-windows-x64'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item 'target\release-deploy\omniphony_source.dll' (Join-Path $dist 'omniphony_source.dll') -Force
          Copy-Item 'source_ffi\include\omniphony_source.h' (Join-Path $dist 'omniphony_source.h') -Force
          foreach ($required in @('omniphony_source.dll', 'omniphony_source.h')) {
            if (!(Test-Path (Join-Path $dist $required))) {
              throw "required source SDK file missing: $required"
            }
          }
          Get-ChildItem $dist | Format-Table Name, Length

      - name: Upload Windows reference host
        uses: actions/upload-artifact@v6
        with:
          name: omniphony-windows-x64-${{ github.sha }}
          path: omniphony-renderer/dist/windows-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Upload causal source SDK
        uses: actions/upload-artifact@v6
        with:
          name: omniphony-source-windows-x64-${{ github.sha }}
          path: omniphony-renderer/dist/source-windows-x64/
          if-no-files-found: error
          retention-days: 14

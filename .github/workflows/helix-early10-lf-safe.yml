name: Helix validate LF-safe Early10

on:
  push:
    branches: [main]
    paths:
      - '.helix/apply_early10_lf_safe.py'
      - '.github/workflows/helix-early10-lf-safe.yml'

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.88.0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          cd omniphony-renderer
          rustup override set "$RUST_TOOLCHAIN"

      - name: Apply LF-safe Early10 patch
        run: |
          python .helix/apply_early10_lf_safe.py
          rustfmt --edition 2024 omniphony-renderer/orender_engine/src/music_early_reflections.rs
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "omniphony-renderer/orender_engine/src/music_early_reflections.rs"

      - name: Test early field and Current support
        working-directory: omniphony-renderer
        run: |
          cargo test -p orender_engine music_early_reflections
          cargo test -p orender_engine music_support
          cargo test -p realtime_ffi

      - name: Commit validated source and remove staging helpers
        run: |
          git config user.name "helix-ci"
          git config user.email "helix-ci@users.noreply.github.com"
          git add omniphony-renderer/orender_engine/src/music_early_reflections.rs
          git rm .helix/apply_early10_lf_safe.py .github/workflows/helix-early10-lf-safe.yml
          git commit -m "fix(current): preserve bass coherence in Early10 field"
          git push origin HEAD:main

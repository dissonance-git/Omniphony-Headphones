name: Omniphony Windows product fallback

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-virtual-endpoint.yml'

concurrency:
  group: omniphony-windows-product
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLAB_REF: 36f124785510ba6e528ddc58e846bc1e27d57741

jobs:
  build-windows11-x64:
    name: Build exact GitLab Windows product
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Clone exact GitLab Omniphony source
        shell: pwsh
        run: |
          git clone --filter=blob:none https://gitlab.com/dissonance-git/Omniphony-Headphones.git "$env:GITHUB_WORKSPACE\omniphony"
          if ($LASTEXITCODE -ne 0) { throw "GitLab clone failed: $LASTEXITCODE" }
          Set-Location "$env:GITHUB_WORKSPACE\omniphony"
          git checkout --detach $env:GITLAB_REF
          if ($LASTEXITCODE -ne 0) { throw "GitLab checkout failed: $LASTEXITCODE" }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITLAB_REF) {
            throw "GitLab exact-source mismatch: expected=$env:GITLAB_REF actual=$actual"
          }
          Write-Host "GITLAB_EXACT_SOURCE_OK $actual"

      - name: Build and validate exact Windows product
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\omniphony\ci\windows-virtual-endpoint.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Canonical Windows product harness failed: $LASTEXITCODE" }

      - name: Upload exact Windows product
        uses: actions/upload-artifact@v4
        with:
          name: omniphony-windows-product-36f12478
          path: |
            omniphony/dist/OmniphonySetup.exe
            omniphony/dist/OmniphonyVirtualEndpoint.zip
          if-no-files-found: error
          retention-days: 14

name: Windows Spatial Sound provider probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-spatial-provider-probe.yml'
      - 'omniphony-renderer/windows_installer/spatial_provider_probe/**'

permissions:
  contents: read

jobs:
  build-probe:
    name: Build spatial provider capability probe
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout Omniphony
        uses: actions/checkout@v4

      - name: Configure probe
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_provider_probe"
          $build = "$env:GITHUB_WORKSPACE\build\spatial-provider-probe"
          cmake -S $source -B $build -A x64
          if ($LASTEXITCODE -ne 0) { throw "Spatial provider probe configure failed: $LASTEXITCODE" }

      - name: Build probe
        shell: pwsh
        run: |
          $build = "$env:GITHUB_WORKSPACE\build\spatial-provider-probe"
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Spatial provider probe build failed: $LASTEXITCODE" }

      - name: Validate capability-only COM provider
        shell: pwsh
        run: |
          $release = "$env:GITHUB_WORKSPACE\build\spatial-provider-probe\Release"
          $ctl = Join-Path $release 'OmniphonySpatialProbeCtl.exe'
          $dll = Join-Path $release 'OmniphonySpatialProbe.dll'
          $smoke = Join-Path $release 'OmniphonySpatialProbeSmoke.exe'
          $staticStreamSmoke = Join-Path $release 'OmniphonySpatialStaticStreamSmoke.exe'
          $objectStreamSmoke = Join-Path $release 'OmniphonySpatialObjectStreamSmoke.exe'
          $snapshotScript = "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_provider_probe\CaptureSpatialProviderState.ps1"
          if (-not (Test-Path $ctl)) { throw "Missing probe control executable: $ctl" }
          if (-not (Test-Path $dll)) { throw "Missing probe COM DLL: $dll" }
          if (-not (Test-Path $smoke)) { throw "Missing probe capability smoke: $smoke" }
          if (-not (Test-Path $staticStreamSmoke)) { throw "Missing static stream lifecycle smoke: $staticStreamSmoke" }
          if (-not (Test-Path $objectStreamSmoke)) { throw "Missing dynamic object stream lifecycle smoke: $objectStreamSmoke" }
          if (-not (Test-Path $snapshotScript)) { throw "Missing spatial selection snapshot script: $snapshotScript" }

          $contract = & $ctl contract
          if ($LASTEXITCODE -ne 0) { throw "Probe contract failed: $LASTEXITCODE" }
          $contract | Write-Host
          $text = $contract -join "`n"
          if ($text -notmatch '\{4BD75423-A66C-4586-B782-1FCBBDF2AE74\}') { throw 'Spatial format GUID drifted' }
          if ($text -notmatch '\{F3CDF827-20C4-405E-A430-8F739343FC89\}') { throw 'Probe COM CLSID drifted' }
          if ($text -notmatch 'NO_AUDIO_PROCESSING\s+1') { throw 'Probe safety contract missing' }
          if ($text -notmatch 'NO_MMDEVICES_WRITES\s+1') { throw 'MMDevices safety contract missing' }
          if ($text -notmatch 'NO_DEFAULT_ENDPOINT_CHANGE\s+1') { throw 'Default-endpoint safety contract missing' }

          $capability = & $smoke $dll
          if ($LASTEXITCODE -ne 0) { throw "ISpatialAudioClient capability smoke failed: $LASTEXITCODE" }
          $capability | Write-Host
          $capText = $capability -join "`n"
          if ($capText -notmatch 'SPATIAL_PROVIDER_COM_OK\s+1') { throw 'COM capability marker missing' }
          if ($capText -notmatch 'SPATIAL_PROVIDER_INTERFACE\s+ISpatialAudioClient') { throw 'ISpatialAudioClient marker missing' }
          if ($capText -notmatch 'SPATIAL_PROVIDER_STATIC_8_1_4_4_OK\s+1') { throw '8.1.4.4 static capability marker missing' }
          if ($capText -notmatch 'SPATIAL_PROVIDER_OBJECT_FORMAT\s+FLOAT32_48000_MONO') { throw 'object format marker missing' }
          if ($capText -notmatch 'SPATIAL_PROVIDER_MAX_DYNAMIC_OBJECTS\s+16') { throw 'dynamic-capacity boundary drifted' }
          if ($capText -notmatch 'SPATIAL_PROVIDER_STREAM_AVAILABLE\s+0') { throw 'stream boundary drifted' }
          if ($capText -notmatch 'SPATIAL_PROVIDER_CAPABILITY_SMOKE_OK\s+1') { throw 'capability smoke marker missing' }

          # Keep the original static-only stream contract executable for ABI/
          # lifecycle compatibility while the live provider advances to the
          # combined object stream.
          $staticLifecycle = & $staticStreamSmoke
          if ($LASTEXITCODE -ne 0) { throw "Static Spatial Audio stream lifecycle smoke failed: $LASTEXITCODE" }
          $staticLifecycle | Write-Host
          $staticText = $staticLifecycle -join "`n"
          if ($staticText -notmatch 'SPATIAL_STATIC_STREAM_COM_OK\s+1') { throw 'static stream COM marker missing' }
          if ($staticText -notmatch 'SPATIAL_STATIC_STREAM_DYNAMIC_CAPACITY\s+0') { throw 'static compatibility stream dynamic boundary drifted' }
          if ($staticText -notmatch 'SPATIAL_STATIC_STREAM_QUANTUM_FRAMES\s+480') { throw 'static stream quantum drifted' }
          if ($staticText -notmatch 'SPATIAL_STATIC_STREAM_IMPLICIT_EOS_OK\s+1') { throw 'static implicit EOS contract failed' }
          if ($staticText -notmatch 'SPATIAL_STATIC_STREAM_LIFECYCLE_SMOKE_OK\s+1') { throw 'static stream lifecycle marker missing' }

          $objectLifecycle = & $objectStreamSmoke
          if ($LASTEXITCODE -ne 0) { throw "Dynamic Spatial Audio object lifecycle smoke failed: $LASTEXITCODE" }
          $objectLifecycle | Write-Host
          $objectText = $objectLifecycle -join "`n"
          if ($objectText -notmatch 'SPATIAL_OBJECT_STREAM_DYNAMIC_CAPACITY_OK\s+1') { throw 'dynamic object capacity contract failed' }
          if ($objectText -notmatch 'SPATIAL_OBJECT_STREAM_STABLE_ID_OK\s+1') { throw 'dynamic stable-ID contract failed' }
          if ($objectText -notmatch 'SPATIAL_OBJECT_STREAM_XYZ_PERSISTENCE_OK\s+1') { throw 'dynamic XYZ persistence contract failed' }
          if ($objectText -notmatch 'SPATIAL_OBJECT_STREAM_RELEASE_RECLAIM_OK\s+1') { throw 'dynamic release/reclaim contract failed' }

          # Read-only enumeration may legitimately find no third-party providers
          # on a clean GitHub-hosted runner. It must not crash or require elevation.
          & $ctl list
          if ($LASTEXITCODE -ne 0) { throw "Read-only provider enumeration failed: $LASTEXITCODE" }

          # The selection snapshot is intentionally useful even when the runner has
          # no real Spatial Sound provider state. CI validates that the bounded,
          # read-only collector itself executes and preserves its safety markers.
          $snapshot = & $snapshotScript -ControlPath $ctl
          $snapshot | Write-Host
          $snapshotText = $snapshot -join "`n"
          if ($snapshotText -notmatch 'SPATIAL_SELECTION_SNAPSHOT_VERSION\s+1') { throw 'snapshot version marker missing' }
          if ($snapshotText -notmatch 'SPATIAL_SELECTION_SNAPSHOT_READ_ONLY\s+1') { throw 'snapshot read-only marker missing' }
          if ($snapshotText -notmatch 'SPATIAL_SELECTION_SNAPSHOT_NO_MMDEVICES_WRITES\s+1') { throw 'snapshot MMDevices safety marker missing' }
          if ($snapshotText -notmatch 'REGISTRY_SECTION\s+SPATIAL_ENCODER') { throw 'snapshot encoder section missing' }
          if ($snapshotText -notmatch 'REGISTRY_SECTION\s+SPATIAL_AUDIO_ENDPOINT') { throw 'snapshot endpoint section missing' }
          if ($snapshotText -notmatch 'SPATIAL_SELECTION_SNAPSHOT_COMPLETE\s+1') { throw 'snapshot completion marker missing' }

      - name: Assemble probe artifact
        shell: pwsh
        run: |
          $release = "$env:GITHUB_WORKSPACE\build\spatial-provider-probe\Release"
          $payload = "$env:GITHUB_WORKSPACE\dist\Omniphony-Spatial-Provider-Probe"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item (Join-Path $release 'OmniphonySpatialProbeCtl.exe') $payload -Force
          Copy-Item (Join-Path $release 'OmniphonySpatialProbe.dll') $payload -Force
          Copy-Item (Join-Path $release 'OmniphonySpatialProbeSmoke.exe') $payload -Force
          Copy-Item (Join-Path $release 'OmniphonySpatialStaticStreamSmoke.exe') $payload -Force
          Copy-Item (Join-Path $release 'OmniphonySpatialObjectStreamSmoke.exe') $payload -Force
          Copy-Item "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_provider_probe\CaptureSpatialProviderState.ps1" $payload -Force
          Copy-Item "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_provider_probe\README.md" $payload -Force
          Get-ChildItem $payload -File | Select-Object Name, Length

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniphony-spatial-provider-probe-${{ github.sha }}
          path: dist/Omniphony-Spatial-Provider-Probe
          if-no-files-found: error
          retention-days: 14

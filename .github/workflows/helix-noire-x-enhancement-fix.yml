name: Helix validate Noire X enhancement repair

on:
  push:
    branches: [main]
    paths:
      - '.helix/apply_noire_x_enhancement_fix.py'
      - '.github/workflows/helix-noire-x-enhancement-fix.yml'

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.88.0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          cd omniphony-renderer
          rustup override set "$RUST_TOOLCHAIN"

      - name: Apply Noire X repair
        run: |
          python .helix/apply_noire_x_enhancement_fix.py
          rustfmt --edition 2024 omniphony-renderer/realtime_ffi/src/listening_finish.rs
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "omniphony-renderer/realtime_ffi/src/listening_finish.rs
omniphony-renderer/windows_installer/endpoint_apo/OmniphonyTray.ps1"

      - name: Test Noire X realtime path
        working-directory: omniphony-renderer
        run: |
          cargo test -p realtime_ffi listening_finish
          cargo test -p realtime_ffi noire_x_profile
          cargo test -p realtime_ffi

      - name: Commit validated source and remove staging helpers
        run: |
          git config user.name "helix-ci"
          git config user.email "helix-ci@users.noreply.github.com"
          git add omniphony-renderer/realtime_ffi/src/listening_finish.rs \
                  omniphony-renderer/windows_installer/endpoint_apo/OmniphonyTray.ps1
          git rm .helix/apply_noire_x_enhancement_fix.py .github/workflows/helix-noire-x-enhancement-fix.yml
          git commit -m "fix(current): keep Noire X enhancement bass-specific"
          git push origin HEAD:main

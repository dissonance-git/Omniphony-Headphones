name: Validate adaptive Omniphony installer

on:
  push:
    branches: [helix/omniphony-endpoint-geometry-fix]
    paths:
      - '.github/workflows/helix-validate-omniphony-installer.yml'

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and verify single-path setup contract
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'omniphony-renderer\windows_installer\endpoint_apo\Install-OmniphonyAdaptive.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'Adaptive installer PowerShell parse failed'
          }
          $iss = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'omniphony-renderer\windows_installer\OmniphonySetup.iss') -Raw
          if ($iss -notmatch 'Install-OmniphonyAdaptive\.ps1') { throw 'Setup does not invoke adaptive installer' }
          if ($iss -match 'Enable-OmniphonySpatialProvider\.ps1') { throw 'Setup still auto-enables the spatial provider' }
          if ($iss -notmatch 'OutputBaseFilename=OmniphonySetup') { throw 'Setup output name drifted' }
          Write-Host 'ADAPTIVE_INSTALLER_PARSE_OK 1'
          Write-Host 'SINGLE_PATH_SETUP_CONTRACT_OK 1'

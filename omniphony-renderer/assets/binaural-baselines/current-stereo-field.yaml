# Protected-master stereo support field.
#
# The finished stereo master never enters this scene. The portable music-field
# processor analyzes real L/R magnitude + phase by frequency and emits twelve
# trustworthy support lanes in canonical 7.1.4 bridge order. Those lanes are
# NOT treated as an authored 22-channel mix. In the active Windows music path
# they are spatial virtual objects rendered by Omniphony/VBAP onto a denser
# ITU-R BS.2051 System-H-derived 22-direction shell before binauralisation.
#
# Design law for this frontier:
#
#   larger environment != blurrier sources
#
# Scale comes from denser full-sphere sampling, room geometry, propagation,
# binaural early reflections and air loss. Direct musical evidence is made
# *narrower* than Baseline 1 so the scene can grow without dissolving into fog.
# The protected master and coherent foundation remain outside the virtual room.
render:
  master_gain: 0.0
  auto_gain: false
  auto_gain_ceiling_db: -2.0

  # Full-sphere VBAP is intentional for the System H shell. Allocate negative-Z
  # cartesian samples so the lower layer is a real part of the gain field rather
  # than decorative output geometry.
  vbap_allow_negative_z: true
  render_evaluation_mode: precomputed_cartesian
  render_evaluation_position_interpolation: true
  evaluation_cartesian_x_size: 12
  evaluation_cartesian_y_size: 12
  evaluation_cartesian_z_size: 8
  evaluation_cartesian_z_neg_size: 4

  # Native speaker effect space. Front/back/height still carry most perceptual
  # distance, but the lower half now has enough scale to close the sphere.
  room_width_m: 19.0
  room_front_m: 17.0
  room_rear_m: 14.0
  room_height_m: 19.0
  room_lower_m: 9.5
  room_ratio_center_blend: 0.22

  # Baseline 1 used 0.09..0.36 spread to knit a 12-speaker shell. The new shell
  # has far more spatial samples, so source spread is deliberately reduced.
  # Envelopment belongs to the room/environment; musical structure stays sharp.
  spread_from_distance: false
  vbap_spread_min: 0.025
  vbap_spread_max: 0.18

  # Phantom extraction remains useful for authored pan motion, but less of it is
  # needed now that the speaker field itself is denser. Keep one pass and avoid
  # manufacturing a diffuse duplicate of every correlated transient.
  synthetic_objects_enabled: true
  phantom_extract_mode: broadband
  phantom_params:
    strength: 0.18
    passes: 1.0
    lift: 0.0
    center: 0.0
    sides: 0.0

  # These are the twelve *evidence-source* poses, not the output layout. The
  # Windows host renders them through VBAP into the separate 22-direction shell.
  # Physical listening now supports keeping the side/rear/lower wrap stable while
  # expanding only the front face. L/R move modestly outward, and the upper-front
  # pair moves both outward and upward. This is geometry, not extra gain.
  virtual_bed:
    radius_m: 1.0
    speakers:
      - name: "L"
        coord_mode: "cartesian"
        x: -1.15
        y: 1.0
        z: 0.10
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.15
        y: 1.0
        z: 0.10
        spatialize: true
        delay_ms: 0

      - name: "C"
        coord_mode: "cartesian"
        x: 0.0
        y: 1.0
        z: 0.0
        spatialize: true
        delay_ms: 0
      - name: "LFE"
        coord_mode: "cartesian"
        x: 0.0
        y: 0.0
        z: 0.0
        spatialize: false
        delay_ms: 0

      - name: "Ls"
        coord_mode: "cartesian"
        x: -1.15
        y: 0.0
        z: 0.14
        spatialize: true
        delay_ms: 0
      - name: "Rs"
        coord_mode: "cartesian"
        x: 1.15
        y: 0.0
        z: 0.14
        spatialize: true
        delay_ms: 0

      - name: "Lb"
        coord_mode: "cartesian"
        x: -0.97
        y: -0.97
        z: 0.14
        spatialize: true
        delay_ms: 0
      - name: "Rb"
        coord_mode: "cartesian"
        x: 0.97
        y: -0.97
        z: 0.14
        spatialize: true
        delay_ms: 0

      - name: "TFL"
        coord_mode: "cartesian"
        x: -1.10
        y: 1.0
        z: 2.45
        spatialize: true
        delay_ms: 0
      - name: "TFR"
        coord_mode: "cartesian"
        x: 1.10
        y: 1.0
        z: 2.45
        spatialize: true
        delay_ms: 0

      - name: "TBL"
        coord_mode: "cartesian"
        x: -0.92
        y: -0.96
        z: 1.50
        spatialize: true
        delay_ms: 0
      - name: "TBR"
        coord_mode: "cartesian"
        x: 0.92
        y: -0.96
        z: 1.50
        spatialize: true
        delay_ms: 0

  binaural:
    output_mode: binaural
    mode: cascaded
    hrir_source: saf
    spectral_compensation: saf_partial

    # Larger metric world than Baseline 1 (7.25 m). Distance is expressed by
    # inherited Omniphony propagation/air/reflection behavior, not extra wetness.
    unit_scale_m: 9.25

    # Steam-Audio-style principle: make the environment physically larger while
    # *reducing* reflection gain. Longer binaural timing + path-dependent wall/HF
    # loss should signal distance without turning the recording into a hall.
    reflections:
      enabled: true
      room_width_m: 23.0
      room_depth_m: 32.0
      room_height_m: 21.0
      level: 0.32

    # Late field is only low-level closure. The bubble is owned by geometry,
    # HRTF/ITD and the early field rather than a large reverb tail.
    reverb:
      enabled: true
      level: 0.028
      rt60_s: 0.16
      predelay_ms: 32.0

    # Native distance-dependent HF attenuation touches only derived support.
    # The authoritative stereo master remains full-band outside this scene.
    air_absorption: true

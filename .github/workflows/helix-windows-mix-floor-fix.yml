name: Helix apply Windows endpoint mix-floor repair

on:
  push:
    branches: [main]
    paths:
      - '.helix/apply_windows_mix_floor_fix.py'

permissions:
  contents: write

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Windows installer repair
        run: |
          python .helix/apply_windows_mix_floor_fix.py
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "omniphony-renderer/windows_installer/endpoint_apo/Install-OmniphonyWindows.ps1
omniphony-renderer/windows_installer/endpoint_apo/OmniphonyMixProbe.cpp"

      - name: Commit source and remove staging helpers
        run: |
          git config user.name "helix-ci"
          git config user.email "helix-ci@users.noreply.github.com"
          git add omniphony-renderer/windows_installer/endpoint_apo/Install-OmniphonyWindows.ps1 \
                  omniphony-renderer/windows_installer/endpoint_apo/OmniphonyMixProbe.cpp
          git rm .helix/apply_windows_mix_floor_fix.py .github/workflows/helix-windows-mix-floor-fix.yml
          git commit -m "fix(windows): accept endpoint-native mix geometry"
          git push origin HEAD:main

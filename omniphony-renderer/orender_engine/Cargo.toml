[package]
name = "orender_engine"
version = "0.2.3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Headless decode→render engine for the Omniphony spatial audio renderer (host-agnostic, no audio I/O)"
repository = "https://github.com/dissonance-git/Omniphony"

[dependencies]
renderer = { version = "0.2.4", path = "../renderer" }
bridge_api = { version = "0.3.0", path = "../bridge_api" }
runtime_control = { version = "0.2.4", path = "../runtime_control" }
sys = { version = "0.1.0", path = "../sys" }
reference_bridge = { path = "../reference_bridge" }
# Audio output/input belong to the host_audio crate and reach the OSC server
# via runtime_control::HostControlHandler — never a dependency of this engine
# so liborender cross-compiles without cpal/pipewire/asio.
abi_stable = "0.11"
anyhow = "1.0"
log = "0.4"
rosc = "0.11"
serde_json = "1.0"
serde_yaml_ng = "0.10"
# Real-input FFT for the DirAC diffuse→height object generator (pure Rust, no
# system deps — safe for the liborender cdylib).
realfft = "3.5"

[features]
# Personalised HRTF loading (SOFA files) in the binaural stage.
sofa = ["renderer/sofa"]

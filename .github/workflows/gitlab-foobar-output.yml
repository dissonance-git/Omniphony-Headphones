name: GitLab exact Output Omniphony build

on:
  push:
    paths:
      - '.github/workflows/gitlab-foobar-output.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.88.0
  GITLAB_REF: b2c9f346a873b5cb16ed50e5a8b3d3d0c6f0240e

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Clone exact GitLab Omniphony source
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://gitlab.com/dissonance-git/Omniphony-Headphones.git source
          if ($LASTEXITCODE -ne 0) { throw "GitLab clone failed: $LASTEXITCODE" }
          git -C source config core.autocrlf false
          git -C source fetch origin $env:GITLAB_REF --depth=1
          if ($LASTEXITCODE -ne 0) { throw "GitLab fetch failed: $LASTEXITCODE" }
          git -C source checkout --detach $env:GITLAB_REF
          if ($LASTEXITCODE -ne 0) { throw "GitLab checkout failed: $LASTEXITCODE" }
          $actual = (git -C source rev-parse HEAD).Trim()
          if ($actual -ne $env:GITLAB_REF) { throw "GitLab SHA mismatch actual=$actual expected=$env:GITLAB_REF" }
          Write-Host "GITLAB_EXACT_OMNIPHONY_SOURCE_OK $actual"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Ensure 7-Zip
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }

      - name: Verify source-session 0.2 and source ABI 0.5 contracts
        shell: pwsh
        run: |
          $session = Get-Content 'source/omniphony-renderer/foobar_output/omniphony_source_session.h' -Raw
          if ($session -notmatch 'OMNIPHONY_FOOBAR_SOURCE_SESSION_ABI_MINOR = 2') {
            throw 'Source-session ABI 0.2 not present'
          }
          $sourceAbi = Get-Content 'source/omniphony-renderer/source_ffi/include/omniphony_source.h' -Raw
          if ($sourceAbi -notmatch 'OMNIPHONY_SOURCE_FLAG_DEPTH_AFFINITY') {
            throw 'Source ABI depth affinity flag not present'
          }

      - name: Build matching Output Omniphony component
        shell: pwsh
        working-directory: source
        run: |
          ./omniphony-renderer/foobar_output/Build-FoobarOutput.ps1 -WorkRoot "$env:RUNNER_TEMP\omniphony-foobar-output" -OutputRoot "$env:GITHUB_WORKSPACE\dist\foobar-output"

      - name: Upload matching output component
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-output-omniphony-${{ github.sha }}
          path: |
            dist/foobar-output/foo_out_omniphony.fb2k-component
            dist/foobar-output/README.txt
            dist/foobar-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

name: Omniphony native APO diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-apo-diagnostic.yml'
      - 'omniphony-renderer/windows_installer/endpoint_apo/**'

permissions:
  contents: read

jobs:
  native-targets:
    name: Probe every native APO target
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup VS2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Ensure Windows 11 WDK
        shell: pwsh
        run: |
          choco install windowsdriverkit11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "WDK installation failed: $LASTEXITCODE" }

      - name: Probe all native targets
        id: probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $source = "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\endpoint_apo"
          $build = "$env:GITHUB_WORKSPACE\build\apo"
          $diagnostics = "$env:GITHUB_WORKSPACE\ci-diagnostics"
          New-Item -ItemType Directory -Force $diagnostics | Out-Null

          function Invoke-CapturedNative {
            param(
              [Parameter(Mandatory=$true)][string]$Label,
              [Parameter(Mandatory=$true)][scriptblock]$Command
            )
            $lines = @(& $Command 2>&1 | ForEach-Object { $_.ToString() })
            $exitCode = $LASTEXITCODE
            if ($null -eq $exitCode) { $exitCode = 0 }
            $tail = @($lines | Select-Object -Last 120)
            [pscustomobject]@{
              label = $Label
              exit_code = [int]$exitCode
              status = $(if ($exitCode -eq 0) { 'success' } else { 'failure' })
              tail = $tail
            }
          }

          $parseLines = @()
          $parseFailed = $false
          $scripts = Get-ChildItem -LiteralPath $source -Filter '*.ps1' -File | Sort-Object Name
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -eq 0) {
              $parseLines += "POWERSHELL_PARSE_OK $($script.Name)"
            } else {
              $parseFailed = $true
              foreach ($parseError in $errors) {
                $parseLines += "POWERSHELL_PARSE_ERROR file=$($script.Name) line=$($parseError.Extent.StartLineNumber) column=$($parseError.Extent.StartColumnNumber) message=$($parseError.Message)"
              }
            }
          }
          $powershellParse = [pscustomobject]@{
            label = 'powershell-support-syntax'
            exit_code = $(if ($parseFailed) { 1 } else { 0 })
            status = $(if ($parseFailed) { 'failure' } else { 'success' })
            tail = @($parseLines | Select-Object -Last 120)
          }
          $powershellParse.tail | ForEach-Object { Write-Host $_ }

          $configure = Invoke-CapturedNative -Label 'cmake-configure' -Command {
            cmake -S $source -B $build -A x64
          }

          $targetResults = @()
          $targets = @(
            'OmniphonyAPO',
            'OmniphonyStreamAPO',
            'OmniphonyApoCtl',
            'OmniphonyApoSmoke',
            'OmniphonyStreamApoSmoke',
            'OmniphonyStreamFallbackSmoke',
            'OmniphonyRealtimeSmoke',
            'OmniphonyMixProbe',
            'OmniphonyProductionProbe',
            'OmniphonySpatialProbe',
            'OmniphonySpatialProviderProbe'
          )

          if ($configure.exit_code -eq 0) {
            foreach ($target in $targets) {
              Write-Host "PROBING_NATIVE_TARGET $target"
              $result = Invoke-CapturedNative -Label $target -Command {
                cmake --build $build --config Release --target $target --verbose
              }
              $targetResults += $result
              Write-Host "NATIVE_TARGET_RESULT target=$target status=$($result.status) exit=$($result.exit_code)"
              if ($result.exit_code -ne 0) {
                $result.tail | ForEach-Object { Write-Host $_ }
              }
            }
          }

          $providerComCanary = [pscustomobject]@{
            label = 'spatial-provider-com-canary'
            exit_code = 0
            status = 'not-run'
            tail = @('not run because OmniphonySpatialProviderProbe did not build')
          }
          $providerTarget = $targetResults | Where-Object { $_.label -eq 'OmniphonySpatialProviderProbe' } | Select-Object -First 1
          if ($configure.exit_code -eq 0 -and $providerTarget -and $providerTarget.exit_code -eq 0) {
            $providerProbe = Join-Path $build 'Release\OmniphonySpatialProviderProbe.exe'
            if (Test-Path $providerProbe) {
              $providerComCanary = Invoke-CapturedNative -Label 'spatial-provider-com-canary' -Command {
                & $providerProbe --probe-com
              }
              Write-Host "SPATIAL_PROVIDER_COM_CANARY status=$($providerComCanary.status) exit=$($providerComCanary.exit_code)"
              $providerComCanary.tail | ForEach-Object { Write-Host $_ }
            } else {
              $providerComCanary = [pscustomobject]@{
                label = 'spatial-provider-com-canary'
                exit_code = 1
                status = 'failure'
                tail = @("provider probe executable missing: $providerProbe")
              }
            }
          }

          $failedTargets = @($targetResults | Where-Object { $_.exit_code -ne 0 } | ForEach-Object label)
          $overall = if (
            $powershellParse.exit_code -ne 0 -or
            $configure.exit_code -ne 0 -or
            $failedTargets.Count -ne 0 -or
            $providerComCanary.exit_code -ne 0
          ) { 'failure' } else { 'success' }
          $record = [ordered]@{
            schema = 'omniphony.windows.native-apo-diagnostic.v1'
            head_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            overall = $overall
            powershell_support_syntax = $powershellParse
            configure = $configure
            failed_targets = $failedTargets
            targets = $targetResults
            provider_com_canary = $providerComCanary
          }
          $record | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$diagnostics\native-apo-targets.json"
          "overall=$overall" >> $env:GITHUB_OUTPUT

      - name: Upload native APO diagnostic record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-apo-diagnostic-${{ github.sha }}
          path: ci-diagnostics/native-apo-targets.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce native target result
        if: always()
        shell: pwsh
        run: |
          $record = Get-Content "$env:GITHUB_WORKSPACE\ci-diagnostics\native-apo-targets.json" -Raw | ConvertFrom-Json
          if ($record.overall -ne 'success') {
            throw "Native APO diagnostic failed: powershell=$($record.powershell_support_syntax.status) configure=$($record.configure.status) targets=$($record.failed_targets -join ',') provider_com=$($record.provider_com_canary.status)"
          }

name: Source-aware spatial validation

on:
  push:
    branches: [main]
    paths:
      - "omniphony-renderer/orender_engine/**"
      - "omniphony-renderer/renderer/**"
      - "omniphony-renderer/scene_contract/**"
      - "omniphony-renderer/source_ffi/**"
      - "omniphony-renderer/realtime_ffi/**"
      - "omniphony-renderer/windows_host/src/spatial_ingress.rs"
      - "omniphony-renderer/windows_host/src/spatial_source_frame.rs"
      - "omniphony-renderer/windows_host/src/spatial_source_slots.rs"
      - "omniphony-renderer/Cargo.toml"
      - "omniphony-renderer/Cargo.lock"
      - "layouts/system-h-derived-22.0-upper60-grid10.yaml"
      - ".github/workflows/source-aware-spatial-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  source-aware-spatial:
    name: FullSphere source path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        id: rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Compile source-shell energy test
        id: compile_shell
        run: cargo test -p renderer --test source_shell_spread_energy --no-run

      - name: Run source-shell energy test
        id: run_shell
        run: cargo test -p renderer --test source_shell_spread_energy

      - name: Compile source-aware engine tests
        id: compile_engine
        run: cargo test -p orender_engine --lib --tests --no-run

      - name: Run source-aware engine tests
        id: run_engine
        run: cargo test -p orender_engine --lib --tests

      - name: Compile source ABI tests
        id: compile_source_ffi
        run: cargo test -p source_ffi --lib --tests --no-run

      - name: Run source ABI tests
        id: run_source_ffi
        run: cargo test -p source_ffi --lib --tests

      - name: Compile Windows spatial source-ingress test
        id: compile_windows_ingress
        run: cargo test -p realtime_ffi --test windows_spatial_source_frame --no-run

      - name: Run Windows spatial source-ingress test
        id: run_windows_ingress
        run: cargo test -p realtime_ffi --test windows_spatial_source_frame

      - name: Write source-aware diagnostic record
        if: always()
        shell: bash
        working-directory: .
        env:
          RUST_OUTCOME: ${{ steps.rust.outcome }}
          COMPILE_SHELL_OUTCOME: ${{ steps.compile_shell.outcome }}
          RUN_SHELL_OUTCOME: ${{ steps.run_shell.outcome }}
          COMPILE_ENGINE_OUTCOME: ${{ steps.compile_engine.outcome }}
          RUN_ENGINE_OUTCOME: ${{ steps.run_engine.outcome }}
          COMPILE_SOURCE_FFI_OUTCOME: ${{ steps.compile_source_ffi.outcome }}
          RUN_SOURCE_FFI_OUTCOME: ${{ steps.run_source_ffi.outcome }}
          COMPILE_WINDOWS_INGRESS_OUTCOME: ${{ steps.compile_windows_ingress.outcome }}
          RUN_WINDOWS_INGRESS_OUTCOME: ${{ steps.run_windows_ingress.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          jq -n \
            --arg schema 'omniphony.ci.source-aware-spatial.v1' \
            --arg head_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg rust "$RUST_OUTCOME" \
            --arg compile_shell "$COMPILE_SHELL_OUTCOME" \
            --arg run_shell "$RUN_SHELL_OUTCOME" \
            --arg compile_engine "$COMPILE_ENGINE_OUTCOME" \
            --arg run_engine "$RUN_ENGINE_OUTCOME" \
            --arg compile_source_ffi "$COMPILE_SOURCE_FFI_OUTCOME" \
            --arg run_source_ffi "$RUN_SOURCE_FFI_OUTCOME" \
            --arg compile_windows_ingress "$COMPILE_WINDOWS_INGRESS_OUTCOME" \
            --arg run_windows_ingress "$RUN_WINDOWS_INGRESS_OUTCOME" \
            '{schema:$schema,head_sha:$head_sha,run_id:$run_id,steps:{rust:$rust,compile_source_shell:$compile_shell,run_source_shell:$run_shell,compile_engine:$compile_engine,run_engine:$run_engine,compile_source_ffi:$compile_source_ffi,run_source_ffi:$run_source_ffi,compile_windows_ingress:$compile_windows_ingress,run_windows_ingress:$run_windows_ingress}}' \
            > ci-diagnostics/source-aware-spatial.json

      - name: Upload source-aware diagnostic record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-aware-spatial-diagnostic-${{ github.sha }}
          path: ci-diagnostics/source-aware-spatial.json
          if-no-files-found: error
          retention-days: 14

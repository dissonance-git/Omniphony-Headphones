name: Wide DSP validation

on:
  push:
    branches: [main, helix/bubble-resolution-next]
    paths:
      - 'layouts/system-h-derived-22.0-upper60-grid10.yaml'
      - 'omniphony-renderer/renderer/**'
      - 'omniphony-renderer/orender_engine/**'
      - 'omniphony-renderer/dsp_fixtures/**'
      - 'omniphony-renderer/Cargo.toml'
      - '.github/workflows/wide-dsp-validation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  bubble-resolution:
    if: github.ref == 'refs/heads/helix/bubble-resolution-next'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helix/bubble-resolution-next
          fetch-depth: 0

      - name: Apply dense FOA HRTF projection
        run: |
          python .helix/apply_bubble_resolution_next.py
          git diff --check

      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          cd omniphony-renderer
          rustup override set "$RUST_TOOLCHAIN"

      - name: Format and test
        run: |
          cd omniphony-renderer
          cargo fmt --all
          git diff --check
          cargo test -p renderer
          cargo test -p orender_engine
          cargo test -p realtime_ffi

      - name: Commit tested source
        run: |
          git config user.name 'helix-ci'
          git config user.email 'helix-ci@users.noreply.github.com'
          git add omniphony-renderer/renderer/src/binaural/hrir.rs \
                  omniphony-renderer/renderer/src/binaural/measured.rs \
                  omniphony-renderer/orender_engine/src/music_late_enclosure.rs
          git commit -m 'feat(current): project late FOA through dense measured HRTF sphere'
          git push origin HEAD:helix/bubble-resolution-next

      - name: Dispatch Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-installer.yml --ref helix/bubble-resolution-next

  wide-dsp:
    if: github.ref == 'refs/heads/main'
    name: Wide DSP matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: omniphony-renderer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Current 8.1.4.4 scene through 22-direction shell
        run: cargo test -p orender_engine --test current_scene_geometry -- --nocapture
      - name: Multi-rate LR4 reconstruction
        run: >-
          cargo test -p renderer --features wide-matrix
          crossover::validation::lr4_reconstruction_is_magnitude_flat_wide
          -- --exact --nocapture
      - name: Full-azimuth ITD model agreement
        run: >-
          cargo test -p renderer --features wide-matrix
          binaural::validation::itd_magnitude_tracks_the_model_wide
          -- --exact --nocapture
      - name: Full-sphere VBAP energy with MDAP spread
        run: >-
          cargo test -p renderer --release --features wide-matrix
          spatial_vbap::panner::native_validation::vbap_conserves_energy_over_the_sphere_wide
          -- --exact --nocapture

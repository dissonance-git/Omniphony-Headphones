[package]
name = "windows_host"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
autobins = false
description = "Windows reference host and tray lifecycle for the portable Omniphony renderer"

[[bin]]
name = "omniphony_app"
path = "src/bin/omniphony_app.rs"

[dependencies]
anyhow = "1"

[target.'cfg(windows)'.dependencies]
# The current reference host uses ordinary WASAPI through CPAL. Historical
# ASIO/E-APO/VST bootstrap routes are not part of this package.
cpal = "0.15.3"

# Current support DSP stays in the portable engine; the Windows host owns only
# capture/playback and lifecycle.
orender_engine = { path = "../orender_engine" }
bridge_api = { path = "../bridge_api" }
renderer = { path = "../renderer" }
scene_contract = { path = "../scene_contract" }

# Direct WASAPI access is host plumbing only; portable renderer semantics remain
# independent of Windows audio-session APIs.
wasapi = "0.23.0"

# Windows owns lifecycle only: one Omniphony executable provides the invisible
# supervisor/tray shell and launches a crash-isolated internal engine instance
# of itself. None of these APIs are visible to the portable renderer crates.
windows-sys = { version = ">=0.59, <=0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

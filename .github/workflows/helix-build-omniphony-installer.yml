name: Helix Omniphony installer dispatch

on:
  push:
    branches: [helix/omniphony-endpoint-geometry-fix]
    paths:
      - '.github/workflows/helix-build-omniphony-installer.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Windows installer for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-installer.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
